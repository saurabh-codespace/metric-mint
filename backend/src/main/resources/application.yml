spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: metric-mint-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ToscanaInsightHub;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: toscana_insights
  flyway:
    enabled: true
    default-schema: toscana_insights
    schemas: toscana_insights
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
app:
  ai:
    provider: ${AI_PROVIDER:disabled}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  security:
    demo-username: ${DEMO_USERNAME:admin}
    demo-password: ${DEMO_PASSWORD:admin}
    # 32-byte base64 key for encrypting source credentials. The default is for local development only; set APP_SECRET_KEY elsewhere.
    secret-key: ${APP_SECRET_KEY:ZGV2LW9ubHktMzItYnl0ZS1rZXktY2hhbmdlLW1lISE=}
  ingestion:
    # Comma-separated hostnames connectors may call (https only). Empty = no outbound pulls.
    allowed-hosts: ${INGESTION_ALLOWED_HOSTS:}
    allow-private-addresses: false
    scheduler-enabled: true
    poll-ms: 60000
    max-upload-bytes: 10485760
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
